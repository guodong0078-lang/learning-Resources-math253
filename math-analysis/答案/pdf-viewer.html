<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PDF 预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900">
    <div class="h-16 bg-slate-950 flex items-center justify-between px-6 border-b border-white/5">
        <!-- 点击这个返回，会回到之前的列表页 -->
        <a href="javascript:history.back()" class="text-slate-400 hover:text-white flex items-center transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> 返回列表
        </a>
        <span id="p-name" class="text-indigo-400 font-mono text-xs italic">正在加载...</span>
        <div class="w-20"></div> <!-- 占位平衡 -->
    </div>
    <div style="height: calc(100vh - 64px);">
        <iframe id="p-frame" src="" width="100%" height="100%" style="border: none;"></iframe>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        if (file) {
            document.getElementById('p-frame').src = file;
            document.getElementById('p-name').innerText = file;
        }
    </script>
</body>
</html>
