<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PDF 在线预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 overflow-hidden">
    <!-- 顶部控制条 -->
    <div class="h-16 bg-slate-950 flex items-center justify-between px-6 border-b border-white/5">
        <!-- 返回键：返回到之前的列表页 -->
        <a href="javascript:history.back()" class="text-slate-400 hover:text-white flex items-center transition">
            <i class="fa-solid fa-arrow-left mr-2"></i>
            <span class="text-sm font-bold uppercase tracking-widest">返回目录</span>
        </a>

        <!-- 动态显示当前文件名 -->
        <span id="pdf-name-display" class="text-xs font-mono text-indigo-400 italic">正在加载...</span>

        <!-- 动态下载链接 -->
        <a id="pdf-download-link" href="#" download class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-500 transition">
            <i class="fa-solid fa-download mr-2"></i>下载 PDF
        </a>
    </div>

    <!-- PDF 展示区域 -->
    <div class="w-full" style="height: calc(100vh - 64px);">
        <!-- 这个 iframe 的 src 会被下面的 JS 动态修改 -->
        <iframe id="pdf-iframe" src="" width="100%" height="100%" style="border: none;"></iframe>
    </div>

    <script>
        // 【关键魔法】从网址里读取要打开哪个文件
        // 比如网址是 view.html?file=习题6.1.pdf
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (fileName) {
            // 1. 让 iframe 加载这个文件
            document.getElementById('pdf-iframe').src = fileName;
            // 2. 更新顶部的文字显示
            document.getElementById('pdf-name-display').innerText = fileName;
            // 3. 更新下载按钮的链接
            document.getElementById('pdf-download-link').href = fileName;
            // 4. 更新浏览器标签页标题
            document.title = "预览: " + fileName;
        } else {
            document.getElementById('pdf-name-display').innerText = "未找到文件";
        }
    </script>
</body>
</html>
