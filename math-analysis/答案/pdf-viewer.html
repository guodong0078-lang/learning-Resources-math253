<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 在线预览 | 数学分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#05080f] overflow-hidden">

    <!-- 顶部操作栏 -->
    <div class="h-14 bg-slate-950/90 backdrop-blur-md flex items-center justify-between px-6 border-b border-white/5 relative z-50">
        <div class="flex items-center space-x-4">
            <!-- 返回按钮：点击回到第六章列表 -->
            <a href="ch6-index.html" class="text-slate-400 hover:text-emerald-400 transition flex items-center text-xs font-bold uppercase tracking-widest">
                <i class="fa-solid fa-chevron-left mr-2"></i> Close Reader
            </a>
            <div class="h-4 w-[1px] bg-white/10"></div>
            <span id="pdf-title" class="text-[10px] font-mono text-emerald-500/60 uppercase tracking-widest italic">Loading...</span>
        </div>
        
        <!-- 下载按钮：提供备选方案 -->
        <a id="download-btn" href="#" download class="bg-emerald-600/20 text-emerald-500 px-3 py-1 rounded border border-emerald-600/30 text-[10px] font-bold hover:bg-emerald-600 hover:text-white transition">
            <i class="fa-solid fa-download mr-1"></i> DOWNLOAD
        </a>
    </div>

    <!-- PDF 容器：占据剩余全部空间 -->
    <div class="w-full" style="height: calc(100vh - 56px);">
        <!-- 这个 iframe 会加载 PDF -->
        <iframe id="pdf-frame" src="" width="100%" height="100%" class="border-none shadow-2xl">
            <p>您的浏览器不支持 PDF 预览，请下载查看。</p>
        </iframe>
    </div>

    <script>
        // 获取 URL 中的参数 (例如: ?file=习题6.1.pdf)
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        
        if (fileName) {
            // 设置网页标题
            document.title = "预览: " + fileName;
            // 设置阅读器里的文件名显示
            document.getElementById('pdf-title').innerText = "Viewing: " + fileName;
            // 设置下载链接
            document.getElementById('download-btn').href = fileName;
            // 核心：设置 iframe 加载对应的 PDF 文件
            document.getElementById('pdf-frame').src = fileName;
        } else {
            alert("未找到对应的文件，请返回重试。");
        }
    </script>
</body>
</html>
